[demodulator]
mode = "hrit"
source = "rtlsdr"

# Change to "airspy" and use [airspy] if you use an Airspy.
[rtlsdr]
frequency = 1694100000
sample_rate = 2400000
gain = 55
# SAWbird+ GOES needs bias tee power (RTL-SDR Blog V3/V4 only).
bias_tee = true
device_index = 0

[costas]
max_deviation = 200e3

[clock_recovery.sample_publisher]
bind = "tcp://127.0.0.1:5002"
send_buffer = 2097152

[quantization.soft_bit_publisher]
bind = "tcp://127.0.0.1:5001"
send_buffer = 1048576

[decoder.packet_publisher]
bind = "tcp://127.0.0.1:5004"
send_buffer = 1048576

[demodulator.stats_publisher]
bind = "tcp://127.0.0.1:6001"

[decoder.stats_publisher]
bind = "tcp://127.0.0.1:6002"

[monitor]
statsd_address = "udp4://localhost:8125"
